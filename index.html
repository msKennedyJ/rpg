
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./styles.css">
    <title>RPG - Dragon Repeller</title>
  </head>
  <body>
    <div id="game">

      <div id="stats">
        <span class="stat">XP: <strong><span id="xpText">0</span></strong></span>
        <span class="stat">Health: <strong><span id="healthText">100</span></strong></span>
        <span class="stat">Gold: <strong><span id="goldText">50</span></strong></span>
      </div>

      <!-- Game image -->
      <div id="content">
        <img id="img" src="images/townSquare.png"
             alt="Town square" class="center">
      </div>

      <div id="controls">
        <button id="button1">Go to Shop</button>
        <button id="button2">Go to Cave</button>
        <button id="button3">Go to Castle</button>
        <button id="button4">Fight Badger</button>
      </div>

      <div id="monsterStats">
        <span class="stat">Monster Name: <strong><span id="monsterName"></span></strong></span>
        <span class="stat">Health: <strong><span id="monsterHealth"></span></strong></span>
      </div>

      <div id="text">
        Welcome to your RPG adventure! You are in the town square.
        Where do you want to go? Use the buttons above.
      </div>

    </div>

    <script src="app.js"></script>
  </body>
</html>
